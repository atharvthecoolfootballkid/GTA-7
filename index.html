<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,
maximum-scale=1,user-scalable=no,
viewport-fit=cover">

<title>Ultimate City</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
user-select:none;
-webkit-user-select:none;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#05070a;
font-family:Arial,sans-serif;
touch-action:none;
}

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
}

#loading{
position:fixed;
inset:0;
z-index:9999;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at 50% 40%,
#263746 0,
#0b1117 42%,
#020305 100%);
color:white;
}

.logo{
font-size:clamp(38px,9vw,90px);
font-weight:900;
letter-spacing:9px;
text-align:center;
}

.subtitle{
margin-top:10px;
font-size:10px;
letter-spacing:5px;
color:#aeb9c2;
}

.bar{
width:min(440px,70vw);
height:5px;
background:#1c252c;
margin-top:32px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:white;
transition:width .15s;
}

#hud{
display:none;
position:fixed;
inset:0;
z-index:20;
pointer-events:none;
color:white;
text-shadow:0 2px 8px #000;
}

#title{
position:absolute;
top:20px;
left:22px;
font-weight:900;
font-size:17px;
letter-spacing:3px;
}

#mode{
margin-top:5px;
font-size:9px;
color:#aeb7bd;
letter-spacing:2px;
}

#clock{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
font-size:12px;
letter-spacing:3px;
}

#info{
position:absolute;
right:22px;
top:20px;
text-align:right;
}

#money{
font-size:17px;
font-weight:bold;
}

#district{
margin-top:5px;
font-size:9px;
color:#bbc4c9;
}

#vehicle{
display:none;
position:absolute;
right:22px;
bottom:28px;
text-align:right;
}

#carName{
font-size:16px;
font-weight:bold;
letter-spacing:2px;
}

#speed{
font-size:34px;
font-weight:900;
margin-top:2px;
}

#unit{
font-size:9px;
color:#aaa;
}

#crosshair{
display:none;
position:absolute;
left:50%;
top:50%;
width:8px;
height:8px;
transform:translate(-50%,-50%);
border:1px solid white;
border-radius:50%;
}

#help{
position:absolute;
left:20px;
bottom:17px;
font-size:10px;
line-height:1.8;
color:#d4d9dc;
}

#touch{
display:none;
position:absolute;
inset:0;
pointer-events:none;
}

#stick{
position:absolute;
left:18px;
bottom:18px;
width:150px;
height:150px;
pointer-events:auto;
}

#stickBase{
position:absolute;
inset:10px;
border-radius:50%;
border:2px solid rgba(255,255,255,.2);
background:rgba(0,0,0,.28);
}

#stickKnob{
position:absolute;
left:46px;
top:46px;
width:58px;
height:58px;
border-radius:50%;
background:rgba(255,255,255,.17);
border:2px solid rgba(255,255,255,.35);
}

.btn{
position:absolute;
width:67px;
height:67px;
border-radius:50%;
background:rgba(0,0,0,.4);
border:1px solid rgba(255,255,255,.3);
color:white;
font-size:9px;
font-weight:bold;
pointer-events:auto;
}

#cam{
right:25px;
bottom:25px;
}

#action{
right:112px;
bottom:25px;
}

#run{
right:112px;
bottom:112px;
}

#brake{
right:25px;
bottom:112px;
}

#pause{
display:none;
position:fixed;
inset:0;
z-index:9000;
background:rgba(0,0,0,.7);
backdrop-filter:blur(12px);
align-items:center;
justify-content:center;
color:white;
text-align:center;
}

#pause h1{
font-size:48px;
letter-spacing:8px;
}

#pause p{
margin-top:10px;
color:#aaa;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="loading">
<div class="logo">ULTIMATE CITY</div>
<div class="subtitle">
OPEN WORLD • 3D • MOBILE
</div>
<div class="bar">
<div class="fill" id="fill"></div>
</div>
</div>

<div id="hud">

<div id="title">
ULTIMATE CITY
<div id="mode">THIRD PERSON</div>
</div>

<div id="clock">12:00</div>

<div id="info">
<div id="money">$12,500</div>
<div id="district">CENTRAL DISTRICT</div>
</div>

<div id="crosshair"></div>

<div id="vehicle">
<div id="carName">CITY RUNNER</div>
<div id="speed">0</div>
<div id="unit">KM/H</div>
</div>

<div id="help">
W A S D — MOVE &nbsp; SHIFT — RUN
&nbsp; V — CAMERA &nbsp; E — ENTER/EXIT
&nbsp; SPACE — JUMP/BRAKE &nbsp; ESC — PAUSE
</div>

<div id="touch">

<div id="stick">
<div id="stickBase"></div>
<div id="stickKnob"></div>
</div>

<button class="btn" id="cam">CAM</button>
<button class="btn" id="action">ENTER</button>
<button class="btn" id="run">RUN</button>
<button class="btn" id="brake">BRAKE</button>

</div>

</div>

<div id="pause">
<div>
<h1>PAUSED</h1>
<p>Press ESC to continue</p>
</div>
</div>

<script type="importmap">
{
"imports":{
"three":
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
}
}
</script>

<script type="module">

import * as THREE from "three";

/* =====================================================
ENGINE
===================================================== */

const canvas=
document.getElementById("game");

const scene=
new THREE.Scene();

scene.background=
new THREE.Color(0x8fa9b8);

scene.fog=
new THREE.FogExp2(
0x8fa9b8,
0.00105
);

const camera=
new THREE.PerspectiveCamera(
70,
innerWidth/innerHeight,
0.1,
2500
);

const renderer=
new THREE.WebGLRenderer({
canvas,
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(
devicePixelRatio,
1.75
)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
THREE.SRGBColorSpace;

renderer.toneMapping=
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=
1.15;

/* =====================================================
LIGHT
===================================================== */

const hemi=
new THREE.HemisphereLight(
0xbfdcff,
0x171b20,
2.1
);

scene.add(hemi);

const sun=
new THREE.DirectionalLight(
0xffe6bf,
3.8
);

sun.position.set(
350,
500,
250
);

sun.castShadow=true;

sun.shadow.mapSize.set(
2048,
2048
);

sun.shadow.camera.left=-600;
sun.shadow.camera.right=600;
sun.shadow.camera.top=600;
sun.shadow.camera.bottom=-600;
sun.shadow.camera.far=1500;

scene.add(sun);

/* =====================================================
WORLD MATERIALS
===================================================== */

const groundMat=
new THREE.MeshStandardMaterial({
color:0x353a3d,
roughness:.96
});

const roadMat=
new THREE.MeshStandardMaterial({
color:0x111315,
roughness:.95
});

const pavementMat=
new THREE.MeshStandardMaterial({
color:0x707477,
roughness:.9
});

const grassMat=
new THREE.MeshStandardMaterial({
color:0x273c2b,
roughness:1
});

const buildingMats=[
0x424a50,
0x555d63,
0x686d70,
0x383f44,
0x625b55,
0x747679
].map(
c=>new THREE.MeshStandardMaterial({
color:c,
roughness:.7,
metalness:.05
})
);

/* =====================================================
GROUND
===================================================== */

const ground=
new THREE.Mesh(
new THREE.PlaneGeometry(
1800,
1800
),
groundMat
);

ground.rotation.x=
-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);

/* =====================================================
ROADS
===================================================== */

const roadPositions=[
-630,
-420,
-210,
0,
210,
420,
630
];

function roadX(z){

const road=
new THREE.Mesh(
new THREE.PlaneGeometry(
1800,
30
),
roadMat
);

road.rotation.x=
-Math.PI/2;

road.position.set(
0,
.025,
z
);

road.receiveShadow=true;

scene.add(road);

const sidewalk1=
new THREE.Mesh(
new THREE.PlaneGeometry(
1800,
4
),
pavementMat
);

sidewalk1.rotation.x=
-Math.PI/2;

sidewalk1.position.set(
0,
.04,
z-18
);

scene.add(sidewalk1);

const sidewalk2=
sidewalk1.clone();

sidewalk2.position.z=
z+18;

scene.add(sidewalk2);
}

function roadZ(x){

const road=
new THREE.Mesh(
new THREE.PlaneGeometry(
30,
1800
),
roadMat
);

road.rotation.x=
-Math.PI/2;

road.position.set(
x,
.025,
0
);

road.receiveShadow=true;

scene.add(road);

const sidewalk1=
new THREE.Mesh(
new THREE.PlaneGeometry(
4,
1800
),
pavementMat
);

sidewalk1.rotation.x=
-Math.PI/2;

sidewalk1.position.set(
x-18,
.04,
0
);

scene.add(sidewalk1);

const sidewalk2=
sidewalk1.clone();

sidewalk2.position.x=
x+18;

scene.add(sidewalk2);
}

for(
const p of roadPositions
){
roadX(p);
roadZ(p);
}

/* =====================================================
LANE MARKINGS
===================================================== */

const lineMat=
new THREE.MeshBasicMaterial({
color:0xd9d2a8
});

for(
const p of roadPositions
){

for(
let i=-850;
i<850;
i+=18
){

const line=
new THREE.Mesh(
new THREE.PlaneGeometry(
9,
.16
),
lineMat
);

line.rotation.x=
-Math.PI/2;

line.position.set(
i,
.07,
p
);

scene.add(line);

const line2=
new THREE.Mesh(
new THREE.PlaneGeometry(
.16,
9
),
lineMat
);

line2.rotation.x=
-Math.PI/2;

line2.position.set(
p,
.07,
i
);

scene.add(line2);
}
}

/* =====================================================
BUILDINGS
===================================================== */

const buildings=[];

function building(
x,
z,
w,
d,
h
){

const mat=
buildingMats[
Math.floor(
Math.random()*
buildingMats.length
)
];

const b=
new THREE.Mesh(
new THREE.BoxGeometry(
w,
h,
d
),
mat
);

b.position.set(
x,
h/2,
z
);

b.castShadow=true;
b.receiveShadow=true;

scene.add(b);

buildings.push({
x,z,w,d,h
});

/* rooftop */

if(
h>70
){

const roof=
new THREE.Mesh(
new THREE.BoxGeometry(
w*.65,
2,
d*.65
),
new THREE.MeshStandardMaterial({
color:0x25292c,
roughness:.75
})
);

roof.position.set(
x,
h+1,
z
);

roof.castShadow=true;

scene.add(roof);
}

/* windows */

const windowMat=
new THREE.MeshStandardMaterial({
color:0x18303c,
roughness:.15,
metalness:.35,
emissive:0x06131a
});

const rows=
Math.floor(h/8);

const cols=
Math.max(
2,
Math.floor(w/5)
);

for(
let r=0;
r<rows;
r++
){

for(
let c=0;
c<cols;
c++
){

if(
Math.random()<.2
)
continue;

const win=
new THREE.Mesh(
new THREE.PlaneGeometry(
1.6,
2.4
),
windowMat
);

win.position.set(
x-w/2+3+c*5,
4+r*8,
z+d/2+.02
);

scene.add(win);

}
}
}

/* city blocks */

for(
let x=-720;
x<=720;
x+=60
){

for(
let z=-720;
z<=720;
z+=60
){

let road=false;

for(
const p of roadPositions
){

if(
Math.abs(x-p)<34||
Math.abs(z-p)<34
)
road=true;
}

if(road)
continue;

building(
x+(Math.random()-.5)*8,
z+(Math.random()-.5)*8,
25+Math.random()*25,
25+Math.random()*25,
18+Math.random()*115
);

}
}

/* =====================================================
PARKS
===================================================== */

function tree(x,z,s=1){

const trunk=
new THREE.Mesh(
new THREE.CylinderGeometry(
.15*s,
.22*s,
2*s,
8
),
new THREE.MeshStandardMaterial({
color:0x4b3424
})
);

trunk.position.set(
x,
s,
z
);

trunk.castShadow=true;

scene.add(trunk);

const crown=
new THREE.Mesh(
new THREE.SphereGeometry(
1.3*s,
12,
10
),
new THREE.MeshStandardMaterial({
color:0x24552f,
roughness:1
})
);

crown.position.set(
x,
2.4*s,
z
);

crown.castShadow=true;

scene.add(crown);
}

for(
let i=0;
i<90;
i++
){

const x=
(Math.random()-.5)*1450;

const z=
(Math.random()-.5)*1450;

let nearRoad=false;

for(
const p of roadPositions
){

if(
Math.abs(x-p)<28||
Math.abs(z-p)<28
)
nearRoad=true;
}

if(!nearRoad)
tree(
x,
z,
.7+Math.random()*.8
);
}

/* =====================================================
PLAYER
===================================================== */

const player={
pos:new THREE.Vector3(
-8,
1,
14
),
vel:new THREE.Vector3(),
yaw:0,
pitch:0,
grounded:true,
first:false,
vehicle:false
};

const playerGroup=
new THREE.Group();

const body=
new THREE.Mesh(
new THREE.CapsuleGeometry(
.38,
1.05,
8,
16
),
new THREE.MeshStandardMaterial({
color:0x202831,
roughness:.75
})
);

body.position.y=1;

body.castShadow=true;

playerGroup.add(body);

const head=
new THREE.Mesh(
new THREE.SphereGeometry(
.32,
18,
18
),
new THREE.MeshStandardMaterial({
color:0xb98268,
roughness:.7
})
);

head.position.y=1.75;

head.castShadow=true;

playerGroup.add(head);

playerGroup.position.copy(
player.pos
);

scene.add(playerGroup);

/* =====================================================
PLAYER COLLISION
===================================================== */

function collide(pos,r=.7){

for(
const b of buildings
){

if(
Math.abs(pos.x-b.x)<
b.w/2+r&&
Math.abs(pos.z-b.z)<
b.d/2+r
){

const dx=
pos.x-b.x;

const dz=
pos.z-b.z;

if(
Math.abs(dx)>
Math.abs(dz)
){

pos.x=
b.x+
Math.sign(dx)*
(b.w/2+r);

}else{

pos.z=
b.z+
Math.sign(dz)*
(b.d/2+r);
}
}
}
}

/* =====================================================
PLAYER INPUT
===================================================== */

const keys={};

addEventListener(
"keydown",
e=>{

keys[e.code]=true;

if(
e.code==="KeyV"
)
cameraToggle();

if(
e.code==="KeyE"
)
interact();

if(
e.code==="Space"
)
jump();

if(
e.code==="Escape"
)
pause();

}
);

addEventListener(
"keyup",
e=>{
keys[e.code]=false;
}
);

/* =====================================================
MOUSE LOOK
===================================================== */

let mouse=false;
let mx=0;
let my=0;

addEventListener(
"mousedown",
e=>{
mouse=true;
mx=e.clientX;
my=e.clientY;
}
);

addEventListener(
"mouseup",
()=>{
mouse=false;
}
);

addEventListener(
"mousemove",
e=>{

if(!mouse)
return;

look(
e.clientX-mx,
e.clientY-my
);

mx=e.clientX;
my=e.clientY;
}
);

function look(
dx,
dy
){

player.yaw-=
dx*.003;

player.pitch-=
dy*.0025;

player.pitch=
THREE.MathUtils.clamp(
player.pitch,
-1.2,
1.2
);
}

/* =====================================================
TOUCH
===================================================== */

const touch=
"ontouchstart" in window||
navigator.maxTouchPoints>0;

if(touch){

document.getElementById(
"touch"
).style.display="block";

document.getElementById(
"help"
).style.display="none";
}

const joystick={
x:0,
y:0
};

const stick=
document.getElementById(
"stick"
);

const knob=
document.getElementById(
"stickKnob"
);

let joy=false;
let joyId=null;

function moveJoy(x,y){

const r=
stick.getBoundingClientRect();

const cx=
r.left+r.width/2;

const cy=
r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const max=48;

const len=
Math.hypot(dx,dy);

if(len>max){

dx=dx/len*max;
dy=dy/len*max;
}

joystick.x=dx/max;
joystick.y=dy/max;

knob.style.transform=
`translate(${dx}px,${dy}px)`;
}

stick.addEventListener(
"touchstart",
e=>{

e.preventDefault();

const t=e.changedTouches[0];

joy=true;
joyId=t.identifier;

moveJoy(
t.clientX,
t.clientY
);
},
{passive:false}
);

addEventListener(
"touchmove",
e=>{

if(!joy)
return;

for(
const t of e.changedTouches
){

if(
t.identifier===joyId
)
moveJoy(
t.clientX,
t.clientY
);
}
},
{passive:false}
);

addEventListener(
"touchend",
e=>{

for(
const t of e.changedTouches
){

if(
t.identifier===joyId
){

joy=false;

joystick.x=0;
joystick.y=0;

knob.style.transform=
"translate(0,0)";
}
}
}
);

/* =====================================================
CAMERA
===================================================== */

function cameraToggle(){

player.first=
!player.first;

document.getElementById(
"mode"
).textContent=
player.vehicle
?(
player.first
?"DRIVING • FIRST PERSON"
:"DRIVING • THIRD PERSON"
)
:(
player.first
?"FIRST PERSON"
:"THIRD PERSON"
);

document.getElementById(
"crosshair"
).style.display=
player.first&&!player.vehicle
?"block"
:"none";

body.visible=
!player.first&&!player.vehicle;

head.visible=
!player.first&&!player.vehicle;
}

/* =====================================================
VEHICLE
===================================================== */

const car={
group:new THREE.Group(),
pos:new THREE.Vector3(
5,
.55,
14
),
angle:0,
speed:0,
max:45
};

function makeCar(){

const g=car.group;

const paint=
new THREE.MeshStandardMaterial({
color:0x31547d,
metalness:.7,
roughness:.22
});

const body=
new THREE.Mesh(
new THREE.BoxGeometry(
4.7,
.72,
1.95
),
paint
);

body.position.y=.75;

body.castShadow=true;

g.add(body);

const glass=
new THREE.Mesh(
new THREE.BoxGeometry(
2.4,
.72,
1.65
),
new THREE.MeshStandardMaterial({
color:0x102029,
metalness:.55,
roughness:.12
})
);

glass.position.set(
-.25,
1.35,
0
);

g.add(glass);

const wheelMat=
new THREE.MeshStandardMaterial({
color:0x111111,
roughness:.8
});

for(
const x of [-1.45,1.45]
){

for(
const z of [-1.03,1.03]
){

const w=
new THREE.Mesh(
new THREE.CylinderGeometry(
.43,
.43,
.28,
18
),
wheelMat
);

w.rotation.z=
Math.PI/2;

w.position.set(
x,
.45,
z
);

g.add(w);
}
}

g.position.copy(
car.pos
);

scene.add(g);
}

makeCar();

/* =====================================================
TRAFFIC
===================================================== */

const traffic=[];

const colors=[
0xa52f35,
0x334b9b,
0xd6d6d6,
0x24272a,
0x687078,
0x2f7654,
0xb27934
];

function trafficCar(
vertical,
lane,
road
){

const g=
new THREE.Group();

const mat=
new THREE.MeshStandardMaterial({
color:
colors[
Math.floor(
Math.random()*colors.length
)
],
metalness:.5,
roughness:.3
});

const b=
new THREE.Mesh(
new THREE.BoxGeometry(
4,
.7,
1.8
),
mat
);

b.position.y=.7;
b.castShadow=true;

g.add(b);

const roof=
new THREE.Mesh(
new THREE.BoxGeometry(
2.2,
.65,
1.5
),
new THREE.MeshStandardMaterial({
color:0x15191c,
metalness:.3,
roughness:.2
})
);

roof.position.set(
-.2,
1.25,
0
);

g.add(roof);

const obj={
group:g,
vertical,
speed:8+Math.random()*8
};

if(vertical){

g.position.set(
road+lane,
.5,
(Math.random()-.5)*1600
);

g.rotation.y=
Math.PI/2;

}else{

g.position.set(
(Math.random()-.5)*1600,
.5,
road+lane
);

g.rotation.y=0;
}

traffic.push(obj);

scene.add(g);
}

for(
let i=0;
i<35;
i++
){

const vertical=
Math.random()<.5;

const road=
roadPositions[
Math.floor(
Math.random()*
roadPositions.length
)
];

const lane=
Math.random()<.5
?-8
:8;

trafficCar(
vertical,
lane,
road
);
}

function updateTraffic(dt){

for(
const c of traffic
){

if(c.vertical){

c.group.position.z+=
c.speed*dt;

if(
c.group.position.z>900
)
c.group.position.z=-900;

}else{

c.group.position.x+=
c.speed*dt;

if(
c.group.position.x>900
)
c.group.position.x=-900;
}
}
}

/* =====================================================
PEDESTRIANS
===================================================== */

const peds=[];

function pedestrian(){

const g=
new THREE.Group();

const shirt=
new THREE.Mesh(
new THREE.CapsuleGeometry(
.22,
.65,
6,
10
),
new THREE.MeshStandardMaterial({
color:
Math.random()>.5
?0x33445d
:0x694438
})
);

shirt.position.y=.65;

shirt.castShadow=true;

g.add(shirt);

const h=
new THREE.Mesh(
new THREE.SphereGeometry(
.2,
12,
12
),
new THREE.MeshStandardMaterial({
color:0xb98067
})
);

h.position.y=1.35;

g.add(h);

const p={
group:g,
angle:
Math.random()*
Math.PI*2,
speed:
.7+Math.random()*.6,
timer:
Math.random()*6
};

peds.push(p);

scene.add(g);
}

for(
let i=0;
i<110;
i++
)
pedestrian();

for(
const p of peds
){

const road=
roadPositions[
Math.floor(
Math.random()*
roadPositions.length
)
];

if(
Math.random()<.5
){

p.group.position.set(
road+
(Math.random()>.5?18:-18),
0,
(Math.random()-.5)*1500
);

}else{

p.group.position.set(
(Math.random()-.5)*1500,
0,
road+
(Math.random()>.5?18:-18)
);
}
}

function updatePeds(dt){

for(
const p of peds
){

p.timer+=dt;

if(
p.timer>
4+Math.random()*5
){

p.timer=0;

p.angle+=
(Math.random()-.5)*2;
}

const dist=
p.group.position.distanceTo(
car.pos
);

if(
dist<10&&
Math.abs(car.speed)>8
){

const flee=
p.group.position.clone()
.sub(car.pos);

flee.y=0;

if(
flee.lengthSq()>.01
){

flee.normalize();

p.angle=
Math.atan2(
flee.x,
flee.z
);
}

p.speed=3.2;

}else{

p.speed=.8;
}

p.group.position.x+=
Math.sin(p.angle)*
p.speed*
dt;

p.group.position.z+=
Math.cos(p.angle)*
p.speed*
dt;

p.group.rotation.y=
p.angle;
}
}

/* =====================================================
VEHICLE PHYSICS
===================================================== */

function updateCar(dt){

if(!player.vehicle)
return;

const throttle=
(keys["KeyW"]?1:0)-
(keys["KeyS"]?1:0)-
joystick.y;

const steer=
(keys["KeyD"]?1:0)-
(keys["KeyA"]?1:0)+
joystick.x;

if(throttle>0)
car.speed+=
28*throttle*dt;

if(throttle<0)
car.speed-=
20*Math.abs(throttle)*dt;

if(
Math.abs(throttle)<.05
){

car.speed=
THREE.MathUtils.lerp(
car.speed,
0,
dt*1.7
);
}

if(
keys["Space"]
)
car.speed=
THREE.MathUtils.lerp(
car.speed,
0,
dt*6
);

car.speed=
THREE.MathUtils.clamp(
car.speed,
-14,
car.max
);

const turn=
Math.min(
Math.abs(car.speed)/20,
1
);

car.angle-=
steer*
turn*
1.8*
dt;

car.pos.x+=
Math.sin(car.angle)*
car.speed*
dt;

car.pos.z+=
Math.cos(car.angle)*
car.speed*
dt;

car.pos.x=
THREE.MathUtils.clamp(
car.pos.x,
-850,
850
);

car.pos.z=
THREE.MathUtils.clamp(
car.pos.z,
-850,
850
);

car.group.position.copy(
car.pos
);

car.group.rotation.y=
car.angle;

player.pos.copy(
car.pos
);

document.getElementById(
"speed"
).textContent=
Math.round(
Math.abs(car.speed)*3.6
);

/* traffic collision */

for(
const c of traffic
){

if(
car.pos.distanceTo(
c.group.position
)<4
){

car.speed*=.35;
}
}
}

/* =====================================================
PLAYER
===================================================== */

function updatePlayer(dt){

if(player.vehicle){

updateCar(dt);
return;
}

let x=
(keys["KeyD"]?1:0)-
(keys["KeyA"]?1:0)+
joystick.x;

let z=
(keys["KeyS"]?1:0)-
(keys["KeyW"]?1:0)+
joystick.y;

const input=
new THREE.Vector3(
x,0,z
);

if(
input.lengthSq()>1
)
input.normalize();

const forward=
new THREE.Vector3(
-Math.sin(player.yaw),
0,
-Math.cos(player.yaw)
);

const right=
new THREE.Vector3(
Math.cos(player.yaw),
0,
-Math.sin(player.yaw)
);

const move=
new THREE.Vector3();

move.addScaledVector(
forward,
-input.z
);

move.addScaledVector(
right,
input.x
);

if(
move.lengthSq()>.001
){

move.normalize();

const speed=
keys["ShiftLeft"]||
keys["ShiftRight"]
?13
:7.5;

player.pos.addScaledVector(
move,
speed*dt
);

playerGroup.rotation.y=
Math.atan2(
move.x,
move.z
);
}

player.vel.y-=22*dt;

player.pos.y+=
player.vel.y*dt;

if(
player.pos.y<1
){

player.pos.y=1;
player.vel.y=0;
player.grounded=true;
}

collide(
player.pos
);

playerGroup.position.copy(
player.pos
);
}

function jump(){

if(
player.vehicle||
!player.grounded
)
return;

player.vel.y=8;

player.grounded=false;
}

/* =====================================================
ENTER / EXIT
===================================================== */

function interact(){

if(player.vehicle){

exitCar();

return;
}

if(
player.pos.distanceTo(
car.pos
)<5
){

player.vehicle=true;

body.visible=false;
head.visible=false;

document.getElementById(
"vehicle"
).style.display="block";

document.getElementById(
"action"
).textContent="EXIT";

cameraToggle();
}
}

function exitCar(){

player.vehicle=false;

const side=
new THREE.Vector3(
Math.cos(car.angle),
0,
-Math.sin(car.angle)
);

player.pos.copy(
car.pos
).addScaledVector(
side,
3
);

player.pos.y=1;

body.visible=!player.first;
head.visible=!player.first;

document.getElementById(
"vehicle"
).style.display="none";

document.getElementById(
"action"
).textContent="ENTER";
}

/* =====================================================
CAMERA
===================================================== */

function updateCamera(){

if(player.vehicle){

if(player.first){

camera.position.copy(
car.pos
);

camera.position.y+=1.55;

const f=
new THREE.Vector3(
Math.sin(car.angle),
0,
Math.cos(car.angle)
);

camera.lookAt(
car.pos.clone()
.addScaledVector(
f,
30
)
);

}else{

const back=
new THREE.Vector3(
-Math.sin(car.angle),
0,
-Math.cos(car.angle)
);

const target=
car.pos.clone();

const desired=
target.clone()
.addScaledVector(
back,
8
);

desired.y+=3.2;

camera.position.lerp(
desired,
.12
);

camera.lookAt(
target.x,
target.y+1,
target.z
);
}

return;
}

if(player.first){

const eye=
player.pos.clone();

eye.y+=1.45;

camera.position.copy(
eye
);

const dir=
new THREE.Vector3(
-Math.sin(player.yaw)*
Math.cos(player.pitch),

Math.sin(player.pitch),

-Math.cos(player.yaw)*
Math.cos(player.pitch)
);

camera.lookAt(
eye.clone().add(
dir.multiplyScalar(25)
)
);

}else{

const target=
player.pos.clone();

target.y+=1.2;

const desired=
new THREE.Vector3(
target.x+
Math.sin(player.yaw)*7,

target.y+3.2,

target.z+
Math.cos(player.yaw)*7
);

camera.position.lerp(
desired,
.13
);

camera.lookAt(
target
);
}
}

/* =====================================================
DAY / NIGHT
===================================================== */

let time=12;

function dayNight(dt){

time+=dt*.18;

if(time>=24)
time-=24;

const angle=
(time/24)*
Math.PI*2-
Math.PI/2;

sun.position.set(
Math.cos(angle)*500,
Math.sin(angle)*500,
250
);

const daylight=
THREE.MathUtils.clamp(
Math.sin(angle)*.5+.5,
.08,
1
);

sun.intensity=
.4+
daylight*3.5;

hemi.intensity=
.35+
daylight*1.9;

const sky=
new THREE.Color();

sky.setHSL(
.57,
.25,
.18+
daylight*.35
);

scene.background=
sky;

scene.fog.color=
sky;

const h=
Math.floor(time)
.toString()
.padStart(2,"0");

const m=
Math.floor(
(time%1)*60
)
.toString()
.padStart(2,"0");

document.getElementById(
"clock"
).textContent=
`${h}:${m}`;
}

/* =====================================================
PAUSE
===================================================== */

let paused=false;

function pause(){

paused=!paused;

document.getElementById(
"pause"
).style.display=
paused
?"flex"
:"none";
}

/* =====================================================
BUTTONS
===================================================== */

document.getElementById(
"cam"
).addEventListener(
"touchstart",
e=>{
e.preventDefault();
cameraToggle();
},
{passive:false}
);

document.getElementById(
"action"
).addEventListener(
"touchstart",
e=>{
e.preventDefault();
interact();
},
{passive:false}
);

document.getElementById(
"brake"
).addEventListener(
"touchstart",
e=>{
e.preventDefault();

if(player.vehicle)
car.speed*=.3;
else
jump();
},
{passive:false}
);

let running=false;

document.getElementById(
"run"
).addEventListener(
"touchstart",
e=>{
e.preventDefault();
running=true;
keys["ShiftLeft"]=true;
},
{passive:false}
);

document.getElementById(
"run"
).addEventListener(
"touchend",
e=>{
e.preventDefault();
running=false;
keys["ShiftLeft"]=false;
},
{passive:false}
);

/* =====================================================
RESIZE
===================================================== */

addEventListener(
"resize",
()=>{

camera.aspect=
innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
innerWidth,
innerHeight
);

renderer.setPixelRatio(
Math.min(
devicePixelRatio,
1.75
)
);
}
);

/* =====================================================
LOOP
===================================================== */

const clock=
new THREE.Clock();

function loop(){

requestAnimationFrame(loop);

const dt=
Math.min(
clock.getDelta(),
.05
);

if(paused)
return;

dayNight(dt);

updateTraffic(dt);

updatePeds(dt);

updatePlayer(dt);

updateCamera();

renderer.render(
scene,
camera
);
}

/* =====================================================
LOADING
===================================================== */

let load=0;

const loader=
setInterval(
()=>{

load+=4;

document.getElementById(
"fill"
).style.width=
load+"%";

if(load>=100){

clearInterval(loader);

document.getElementById(
"loading"
).style.display="none";

document.getElementById(
"hud"
).style.display="block";

loop();
}
},
45
);

</script>

</body>
